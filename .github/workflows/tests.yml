name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # Chromium is only needed to render the corpus, not to score it, so the
      # test suite deliberately runs without `playwright install`.
      - name: Test
        run: pytest tests -q
      - name: Corpus manifest is self-consistent
        run: python -c "import json;m=json.load(open('data/synthetic/manifest.json'));assert m['n_documents']==len(m['documents'])"
